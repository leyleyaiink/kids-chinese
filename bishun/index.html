/* Layout: copybook app — lesson tabs on top, character strip, then a big 田字格 practice square beside a control column (stacks on portrait). Single deliberate light "paper" look. */
:root{
  --paper:#fbfaf4;
  --card:#ffffff;
  --ink:#1f2a24;
  --muted:#6b776f;
  --green:#3e8e4f;
  --green-soft:#e3f1e3;
  --grid:#e25a4f;
  --hint:#f08c1c;
  --wrong:#d93b3b;
  --guide:#d9ddd6;
  --line:#d7dccf;
  --kai:"AppKai","BiauKai","DFKai-SB","標楷體","Kaiti TC",serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--kai);margin:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.7rem;margin:0;letter-spacing:.06em;display:flex;align-items:center;gap:.4em}
h1 .ver{font-size:.6em;font-weight:400;color:var(--green);border:1.5px solid var(--green);border-radius:999px;padding:.15em .7em;letter-spacing:.08em}
h1 .seal{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border:2px solid var(--grid);color:var(--grid);border-radius:6px;font-size:.8em}
.score{font-size:1rem;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.modebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.modes{display:flex;border:2px solid var(--green);border-radius:999px;overflow:hidden}
.mode{font:inherit;font-size:1.1rem;padding:.45em 1em;border:0;background:var(--card);color:var(--green);cursor:pointer}
.mode[aria-pressed="true"]{background:var(--green);color:#fff}
.src{display:flex;flex-direction:column;gap:4px;font-size:.95rem;color:var(--muted);line-height:1.55;border-top:1.5px dashed var(--line);padding-top:12px}
.src b{color:var(--ink)}
.src a{color:var(--green)}
.modenote{font-size:1.05rem;color:var(--muted);line-height:1.5}
.tab{font:inherit;font-size:1.15rem;padding:.45em .9em;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.strip{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:6px}
.ch{font:inherit;font-size:1.6rem;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;position:relative;padding:0}
.ch[aria-current="true"]{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.ch .st{position:absolute;right:4px;bottom:2px;font-size:.62rem;color:var(--hint);letter-spacing:-1px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.board{background:var(--card);border-radius:18px;padding:14px;border:2px solid var(--line);display:flex;justify-content:center}
#cv{touch-action:none;display:block;border-radius:6px}
.side{display:flex;flex-direction:column;gap:12px}
.info{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:16px}
.zy{font-size:2.2rem;color:var(--green);line-height:1.1;letter-spacing:.04em}

const len=p=>{let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L};
function resample(p,n){
  if(p.length===1)return Array(n).fill(p[0]);
  const L=len(p),out=[p[0]];let step=L/(n-1),acc=0,i=1,prev=p[0];
  while(out.length<n-1&&i<p.length){const cur=p[i];const d=Math.hypot(cur[0]-prev[0],cur[1]-prev[1]);
    if(acc+d>=step&&d>0){const t=(step-acc)/d;const q=[prev[0]+t*(cur[0]-prev[0]),prev[1]+t*(cur[1]-prev[1])];out.push(q);prev=q;acc=0;}
    else{acc+=d;prev=cur;i++;}}
  while(out.length<n)out.push(p[p.length-1]);return out;
}
const mdist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=Math.hypot(a[i][0]-b[i][0],a[i][1]-b[i][1]);return s/a.length};
function score(user,med){
  const N=24,u=resample(user,N),m=resample(med,N);
  const f=mdist(u,m),r=mdist(u,[...m].reverse());
  const L=len(med),thr=24+0.13*L,ul=len(user);
  const lenOK=L<40?true:(ul>0.35*L&&ul<2.6*L);
  return {f,r,thr,ok:f<thr&&lenOK&&f<=r+4,rev:r<thr&&r+4<f&&lenOK};
}

function arrow(p,color){
  if(p.length<2)return;const k=K();const a=p[p.length-2],b=p[p.length-1];
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const x=b[0]*k,y=b[1]*k,s=10*k;
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*s,y+Math.sin(ang)*s);
  ctx.lineTo(x+Math.cos(ang+2.5)*s,y+Math.sin(ang+2.5)*s);ctx.lineTo(x+Math.cos(ang-2.5)*s,y+Math.sin(ang-2.5)*s);ctx.fill();
}
let live=null; // user's current stroke in 256 space
function draw(extra){
  grid();
  if(busy||mode==="test"||$("ghost").checked)strokes.forEach(p=>ink(p,"#dde1da",11));
  for(let i=0;i<done;i++)ink(strokes[i],"#1f2a24",11);
  if(hintStroke>=0&&hintStroke<strokes.length){ink(strokes[hintStroke],"rgba(240,140,28,.55)",11);arrow(strokes[hintStroke],"#f08c1c");label(strokes[hintStroke],hintStroke+1,"#f08c1c");}
  if(extra)extra();
  if(live&&live.length>1){ctx.strokeStyle="#2b5fb8";ctx.lineWidth=12*K()/1.2;ctx.lineCap="round";ctx.lineJoin="round";path(live);ctx.stroke();}
}
function setMsg(t,cls=""){const m=$("msg");m.textContent=t;m.className="msg "+cls;}
function updInfo(){$("cur").textContent=Math.min(done+1,strokes.length);$("tot").textContent=strokes.length;}

// ---------- animation ----------
let animToken=0;
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function animateStroke(i,color,token,ms){
  const p=strokes[i];const L=Math.max(len(p),20);const dur=ms||Math.min(900,350+L*3);const t0=performance.now();
  return new Promise(res=>{function step(now){if(token!==animToken)return res(false);
    const f=Math.min(1,(now-t0)/dur);draw(()=>{for(let j=0;j<i;j++){ink(strokes[j],"#1f2a24",11);}ink(p,color,11,f);label(p,i+1,color);});
    if(f<1)requestAnimationFrame(step);else res(true);}requestAnimationFrame(step);});
}
async function playAll(){
  const token=++animToken;busy=true;const saveDone=done;done=0;hintStroke=-1;
  setMsg("仔細看，一畫一畫照順序寫。點一下寫字格可以跳過。");
  for(let i=0;i<strokes.length;i++){
    $("cur").textContent=i+1;
    const ok=await animateStroke(i,"#e25a4f",token);if(!ok)return;
    await sleep(180);if(token!==animToken)return;
  }
  await sleep(400);if(token!==animToken)return;
  done=0;busy=false;miss=0;missHere=0;draw();updInfo();
  setMsg("換你寫寫看！從第 1 畫開始。");
}
function stopAnim(){if(busy){animToken++;busy=false;done=0;miss=0;missHere=0;hintStroke=-1;draw();updInfo();setMsg("換你寫寫看！從第 1 畫開始。");}}
async function flashHint(i){
  hintStroke=-1;const token=++animToken;busy=true;
  await animateStroke(i,"#f08c1c",token,700);
  busy=false;if(token!==animToken)return;
  if(missHere>=(mode==="test"?3:2))hintStroke=i;
  draw();
}

// ---------- input ----------
let drawing=false,pid=null;
function toLocal(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*256,(e.clientY-r.top)/r.height*256];}
cv.addEventListener("pointerdown",e=>{
  if(e.pointerType==="pen")penSeen=true;
  if(penSeen&&e.pointerType==="touch")return; // palm rejection once a pencil is used
  if(busy){stopAnim();return;}
  if(done>=strokes.length)return;
  drawing=true;pid=e.pointerId;cv.setPointerCapture(e.pointerId);live=[toLocal(e)];draw();e.preventDefault();
});
cv.addEventListener("pointermove",e=>{
  if(!drawing||e.pointerId!==pid)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs)live.push(toLocal(ev));draw();
});
function endStroke(e){
  if(!drawing||e.pointerId!==pid)return;drawing=false;
  const user=live;live=null;
  if(!user||len(user)<4&&strokes[done].length>1){draw();return;}
  judge(user.length>1?user:[user[0],user[0]]);
}
cv.addEventListener("pointerup",endStroke);cv.addEventListener("pointercancel",e=>{drawing=false;live=null;draw();});

function judge(user){
  const k=done;const s=score(user,strokes[k]);
  if(s.ok){
    done++;missHere=0;hintStroke=-1;draw();updInfo();
    if(done>=strokes.length){finish();}
    else setMsg(`很好！第 ${k+1} 畫寫對了。接著寫第 ${k+2} 畫。`,"good");
    return;
  }
  miss++;missHere++;
  // which stroke did the child probably write?
  let best=-1,bv=1e9;
  for(let j=k+1;j<strokes.length;j++){const t=score(user,strokes[j]);if(t.ok&&t.f<bv){bv=t.f;best=j;}}
  if(best>=0){
    setMsg(`筆順不對喔！你寫的是第 ${best+1} 畫，現在要先寫第 ${k+1} 畫。看橘色的提示。`,"bad");
  }else if(s.rev){
    setMsg(`方向寫反了！第 ${k+1} 畫要從圓點那一頭開始寫。`,"warn");
  }else{
    setMsg(`再試一次！第 ${k+1} 畫寫在橘色這裡。`,"warn");
  }
  if(mode==="test"){ if(missHere>=3){flashRed(user).then(()=>flashHint(k));} else {setMsg(best>=0?`筆順錯了！想一想，第 ${k+1} 畫應該先寫哪一筆？`:`再想想，第 ${k+1} 畫要寫在哪裡？`,"bad");flashRed(user).then(()=>draw());} return; }
  flashRed(user).then(()=>flashHint(k));
}
function flashRed(user){
  return new Promise(res=>{draw(()=>{ctx.strokeStyle="rgba(217,59,59,.8)";ctx.lineWidth=12*K()/1.2;ctx.lineCap="round";path(user);ctx.stroke();});setTimeout(res,450);});
}
function finish(){
  const st=miss===0?3:miss<=2?2:1;
  BEST[ch]=Math.max(BEST[ch]||0,st);saveBest();renderStrip();renderScore();
  $("stars").textContent="★".repeat(st)+"☆".repeat(3-st);
  setMsg(miss===0?`太棒了！「${ch}」的筆順全部正確！`:`寫完了！錯了 ${miss} 次，再寫一次會更好。`,"good");
}

// ---------- UI ----------
function renderTabs(){const t=$("tabs");t.innerHTML="";LESSONS.forEach((L,i)=>{const b=document.createElement("button");b.className="tab";b.type="button";b.textContent=`第${NUM[i]}課`;b.setAttribute("aria-pressed",i===lesson);b.onclick=()=>{lesson=i;idx=0;renderTabs();renderStrip();pick(0)};t.appendChild(b);});}
function renderStrip(){const s=$("strip");s.innerHTML="";[...LESSONS[lesson]].forEach((c,i)=>{const b=document.createElement("button");b.className="ch";b.type="button";b.textContent=c;b.setAttribute("aria-label",c);if(i===idx)b.setAttribute("aria-current","true");
  if(BEST[c]){const st=document.createElement("span");st.className="st";st.textContent="★".repeat(BEST[c]);b.appendChild(st);}
  b.onclick=()=>pick(i);s.appendChild(b);});}
function renderScore(){let n=0,all=0;LESSONS.forEach(L=>{for(const c of L){all++;if(BEST[c]===3)n++;}});$("score").textContent=`三顆星：${n} / ${all} 字`;}
function pick(i){
  idx=i;ch=LESSONS[lesson][i];strokes=DATA[ch];done=0;miss=0;missHere=0;hintStroke=-1;animToken++;busy=false;
  $("bigch").textContent=ch;$("zy").textContent=ZY[ch]||"";$("stars").textContent="";
  [...$("strip").children].forEach((b,j)=>{if(j===i)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current");});
  updInfo();draw();
  if(mode==="prac"&&$("autoplay").checked)setTimeout(playAll,250);else setMsg(mode==="test"?"考試開始！照筆順寫出「"+ch+"」。":"從第 1 畫開始寫。");
}
$("play").onclick=()=>{playAll()};
$("redo").onclick=()=>{animToken++;busy=false;done=0;miss=0;missHere=0;hintStroke=-1;$("stars").textContent="";draw();updInfo();setMsg("重新開始，從第 1 畫寫起。");};
$("hint").onclick=()=>{if(done<strokes.length){missHere=2;flashHint(done);setMsg(`第 ${done+1} 畫在橘色這裡，從圓點開始寫。`,"warn");}};
$("next").onclick=()=>{const L=LESSONS[lesson];if(idx<L.length-1)pick(idx+1);else if(lesson<LESSONS.length-1){lesson++;renderTabs();renderStrip();pick(0);}};
$("prev").onclick=()=>{if(idx>0)pick(idx-1);else if(lesson>0){lesson--;renderTabs();renderStrip();pick(LESSONS[lesson].length-1);}};
$("ghost").onchange=()=>draw();
let mode="prac";
function setMode(m){mode=m;$("mPrac").setAttribute("aria-pressed",m==="prac");$("mTest").setAttribute("aria-pressed",m==="test");
  $("play").hidden=$("hint").hidden=$("ghostRow").hidden=$("autoRow").hidden=(m==="test");
  $("modenote").textContent=m==="test"?"考試模式：不先播放、沒有提示，寫錯 3 次才會出現提示。":"";
  pick(idx);}
$("mPrac").onclick=()=>setMode("prac");$("mTest").onclick=()=>setMode("test");
window.addEventListener("resize",sizeCanvas);
renderTabs();renderStrip();renderScore();
requestAnimationFrame(()=>{sizeCanvas();pick(0);});
</script>
